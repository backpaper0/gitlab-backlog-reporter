# サンプル GitLab を立てる。サンプルデータは scripts/seed_example.py で投入する。
# golden とスナップショットの URL を変えないため、external_url とポートは http://localhost:9080 に固定する。
services:
  gitlab:
    image: gitlab/gitlab-ce:19.0.0-ce.0
    hostname: localhost
    ports:
      - "9080:9080"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:9080'
        gitlab_rails['initial_root_password'] = File.read('/run/secrets/root_password').strip
        prometheus_monitoring['enable'] = false
    volumes:
      # ローカル専用の固定値。外に公開する環境では使わない
      - ./root_password:/run/secrets/root_password:ro
      - config:/etc/gitlab
      - logs:/var/log/gitlab
      - data:/var/opt/gitlab
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9080/-/readiness || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 600s

volumes:
  config:
  logs:
  data:
