[project]
name = "gitlab-backlog-reporter"
version = "0.1.0"
description = "GitLab のバックログとスプリントの進捗を Markdown のレポートにする"
authors = [
    { name = "Uragami Taichi", email = "backpaper0@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
gbr = "gitlab_backlog_reporter.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.88",
]

[tool.uv]
# Python は mise ではなく uv が管理する（バージョンは .python-version）
python-preference = "only-managed"
# リリースから 7 日経っていないパッケージは使わない
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
