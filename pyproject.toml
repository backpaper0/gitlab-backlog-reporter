[project]
name = "gitlab-backlog-reporter"
version = "0.1.0"
description = "GitLab のバックログとスプリントの進捗を Markdown のレポートにする"
authors = [
    { name = "Uragami Taichi", email = "backpaper0@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
gbr = "gitlab_backlog_reporter.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
